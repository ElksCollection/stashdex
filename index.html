<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Niet opnemen in Google en andere zoekmachines -->
  <meta name="robots" content="noindex, nofollow">
  <title>Stashdex</title>
  <!-- Logo in het browsertabblad en als icoon op het beginscherm -->
  <link rel="icon" type="image/svg+xml" href="logo/stashdex-logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="logo/favicon-32.png">
  <link rel="apple-touch-icon" href="logo/apple-touch-icon.png">
  <!-- Thema en beweging instellen vóórdat de pagina getekend wordt (anders flitst hij eerst licht) -->
  <script>
    (function () {
      var get = function (k, d) { try { var v = localStorage.getItem("stashdex-" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
      var theme = get("theme", "auto"), motion = get("motion", "on");
      if (theme === "auto") theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) motion = "off";
      document.documentElement.dataset.theme = theme;
      document.documentElement.dataset.motion = motion;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Ontwerpsysteem (laadt ook de lettertypes) + de opmaak van deze app -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <!-- Inlogscherm: alleen dit is zichtbaar zolang je niet bent ingelogd -->
  <section class="auth" id="login" hidden>
    <div class="auth-inner">
      <h1 class="auth-title">Stashdex</h1>
      <form class="auth-form" id="loginForm">
        <label class="fld"><span class="flabel">E-mail</span>
          <input class="kk-input" id="email" type="email" autocomplete="username" required></label>
        <label class="fld"><span class="flabel">Wachtwoord</span>
          <input class="kk-input" id="password" type="password" autocomplete="current-password" required></label>
        <label class="check"><input id="remember" type="checkbox" checked> Onthoud mij</label>
        <button type="submit" class="kk-btn kk-btn-primary" id="loginBtn">Inloggen</button>
        <p class="msg-error" id="error" role="alert"></p>
        <p class="msg-ok" id="loginNotice" role="status"></p>
        <button type="button" class="linkbtn" id="toForgot">Wachtwoord vergeten?</button>
      </form>
    </div>
  </section>

  <!-- Wachtwoord vergeten: stuurt een mail met een link om een nieuw wachtwoord te kiezen -->
  <section class="auth" id="forgot" hidden>
    <div class="auth-inner">
      <h1 class="auth-title">Stashdex</h1>
      <form class="auth-form" id="forgotForm">
        <h2>Wachtwoord vergeten</h2>
        <p class="hint">Vul je e-mailadres in. Je krijgt een mail met een link om een nieuw wachtwoord te kiezen.</p>
        <label class="fld"><span class="flabel">E-mail</span>
          <input class="kk-input" id="forgotEmail" type="email" autocomplete="username" required></label>
        <button type="submit" class="kk-btn kk-btn-primary" id="forgotBtn">Stuur mail</button>
        <p class="msg-error" id="forgotError" role="alert"></p>
        <p class="msg-ok" id="forgotNotice" role="status"></p>
        <button type="button" class="linkbtn" id="toLogin">Terug naar inloggen</button>
      </form>
    </div>
  </section>

  <!-- Nieuw wachtwoord: verschijnt na het openen van de link uit de mail -->
  <section class="auth" id="newpw" hidden>
    <div class="auth-inner">
      <h1 class="auth-title">Stashdex</h1>
      <form class="auth-form" id="newpwForm">
        <h2>Nieuw wachtwoord kiezen</h2>
        <label class="fld"><span class="flabel">Nieuw wachtwoord</span>
          <input class="kk-input" id="newPassword" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="fld"><span class="flabel">Herhaal wachtwoord</span>
          <input class="kk-input" id="newPassword2" type="password" autocomplete="new-password" minlength="8" required></label>
        <button type="submit" class="kk-btn kk-btn-primary" id="newpwBtn">Opslaan</button>
        <p class="msg-error" id="newpwError" role="alert"></p>
        <!-- Alleen zichtbaar als je via Instellingen je wachtwoord wijzigt -->
        <button type="button" class="linkbtn" id="newpwCancel" hidden>Annuleren</button>
      </form>
    </div>
  </section>

  <!-- De app zelf; wordt gevuld door js/app.js -->
  <div class="app" id="home" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
