<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Niet opnemen in Google en andere zoekmachines -->
  <meta name="robots" content="noindex, nofollow">
  <title>Stashdex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Figtree:wght@500;700&display=swap" rel="stylesheet">
  <style>
    /* Tijdelijke beginpagina in de Kaartenkluis-stijl: hemelsblauw met gele titel */
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 30%, #7cc8ff, #2f8fe0 70%);
      font-family: "Figtree", system-ui, sans-serif;
      color: #0b2a4a;
      text-align: center;
      padding: 16px;
      box-sizing: border-box;
    }
    h1 {
      font-family: "Titan One", sans-serif;
      font-weight: 400;
      font-size: clamp(3rem, 12vw, 6rem);
      margin: 0;
      color: #ffd23f;
      -webkit-text-stroke: 3px #0b2a4a;
      text-shadow: 0 6px 0 #0b2a4a;
      letter-spacing: 1px;
    }
    p {
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Stashdex</h1>
    <p>Binnenkort hier.</p>
  </main>
</body>
</html>
